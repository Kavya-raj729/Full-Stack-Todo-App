{% load static %}

<!DOCTYPE html>
<html>

<head>

    <title>Login</title>

    <link rel="stylesheet" href="{% static 'users/css/style1.css' %}">

</head>

<body>

    <div class="container">

        <h1 class="heading">
            Welcome to Todo App
        </h1>

        <p class="sub-heading">
            Login to continue
        </p>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form id="login-form">

            {% csrf_token %}

            <input type="text" id="username" placeholder="Username" class="input-box">

            <input type="password" id="password" placeholder="Password" class="input-box">

            <button type="submit" class="btn">

                Login

            </button>

        </form>
        <script>

            document
                .getElementById('login-form')

                .addEventListener('submit', async function (e) {

                    e.preventDefault();

                    const username =
                        document.getElementById('username').value;

                    const password =
                        document.getElementById('password').value;

                    const response = await fetch('/api/token/', {

                        method: 'POST',

                        headers: {
                            'Content-Type': 'application/json'
                        },

                        body: JSON.stringify({

                            username,
                            password

                        })

                    });

                    const data = await response.json();

                    if (data.access) {

                        localStorage.setItem(
                            'access',
                            data.access
                        );

                        localStorage.setItem(
                            'refresh',
                            data.refresh
                        );

                        window.location.href = '/tasks/';

                    }

                    else {

                        alert('Invalid Credentials');

                    }

                });

        </script>

        <p class="link-text">
            Create Account?
            <a href="/register/">
                Sign Up
            </a>
        </p>

    </div>

</body>

</html>
